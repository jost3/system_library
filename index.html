<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" href="img/hessen icono.png" type="image/x-icon">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/ventana1.css">
</head>
<style>
    body{
        background: url(img/fond_form.jpeg);
    }

</style>
<body>
    <div class="container-form sign-up">
        <div class="welcome-back">
            <div class="message">
                <h2>Bienvenido a Hessen Bliblioteca</h2>
                <p>Si eres administrador inicia sesion aqui</p>
                <button class="sign-up-btn">Iniciar Sesion</button>
            </div>
        </div>
        <form class="formulario">
            <h2 class="create-account">HESSEN LIBRARY</h2>
            <p class="cuenta-gratis"></p>
            <input type="email" placeholder="email">
            <input type="password" placeholder="contraseña">
            <input type="submit" value="Iniciar sesion">
        </form>
    </div>
    <div class="container-form sign-in">
        <form class="formulario" action="validacion.php" method="post">
            <h2 class="create-account">HESSEN LIBRARY</h2>

            <p class="cuenta-gratis"></p>
            <input type="text" id="usuario" name="usuario" placeholder="usuario" required>
            <input type="password" id="contraseña" name="contraseña" placeholder="contraseña" required>
            <input type="submit" value="Ingresar">
        </form>
        <div class="welcome-back">
            <div class="message">
                <h2>Bienvenido de nuevo</h2>
                <p>Si no eres administrador inicia sesion aqui </p>
                <button class="sign-in-btn">Iniciar de sesion</button>
            </div>
        </div>
    </div>
    <script>
        const $btnSignIn= document.querySelector('.sign-in-btn'),
      $btnSignUp = document.querySelector('.sign-up-btn'),  
      $signUp = document.querySelector('.sign-up'),
      $signIn  = document.querySelector('.sign-in');

document.addEventListener('click', e => {
    if (e.target === $btnSignIn || e.target === $btnSignUp) {
        $signIn.classList.toggle('active');
        $signUp.classList.toggle('active')
    }
});
    </script>
</body>
</html>
