<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" href="img/hessen icono.png" type="image/x-icon">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/ventana1.css">
</head>
<style>
    body{
        background: url(img/inicio.jpeg);
        background-size: cover; /* La imagen se ajustará al tamaño de la ventana */
        background-repeat: no-repeat; /* Evita la repetición de la imagen */
        background-attachment: fixed; /* Evita que la imagen se desplace con el scroll */
    }

</style>
<body>
    <div class="container-form sign-up">
        <div class="welcome-back">
            <div class="message">
                <h2>Bienvenido a Hessen Bliblioteca</h2>
                <p>Si eres administrador inicia sesion aqui</p>
                <button class="sign-up-btn">Iniciar Sesion</button>
            </div>
        </div>
        <form class="formulario" action="valida_stud.php" method="post">
            <h2 class="create-account">HESSEN LIBRARY</h2>
            <img src="img/hessen icono.png" alt="Icono de inicio de sesión">
            <p class="cuenta-gratis"></p>
            <input type="text" id="user" name="user" placeholder="usuario" required>
            <input type="password" id="contra1" name="contra1" placeholder="contraseña" required>
            <input type="submit" value="Ingresar">
        </form>
    </div>
    <div class="container-form sign-in">
        <form class="formulario" action="validacion.php" method="post">
            <h2 class="create-account">HESSEN LIBRARY</h2>
            <img src="img/hessen icono.png" alt="Icono de inicio de sesión">
            <p class="cuenta-gratis"></p>
            <input type="text" id="usuario" name="usuario" placeholder="usuario" required>
            <input type="password" id="contraseña" name="contraseña" placeholder="contraseña" required>
            <input type="submit" value="Ingresar">
        </form>
        <div class="welcome-back">
            <div class="message" id="c1">
                <h2>Bienvenido de nuevo</h2>
                <p>Si no eres administrador inicia sesion aqui </p>
                <button class="sign-in-btn">Iniciar de sesion</button>
            </div>
        </div>
    </div>
    <div id="myModal" class="modal">
        <div class="modal-content">
            <p id="mensajeModal"></p>
            <button class="notification-button" onclick="cerrarModal()">Cerrar</button>  <!-- se quito la X eh hice que se cambiara el estilo de la ventana -->
        </div>
    </div>
    <script src="js/alert-login.js"></script>
    <script>
        const $btnSignIn= document.querySelector('.sign-in-btn'),
      $btnSignUp = document.querySelector('.sign-up-btn'),  
      $signUp = document.querySelector('.sign-up'),
      $signIn  = document.querySelector('.sign-in');

document.addEventListener('click', e => {
    if (e.target === $btnSignIn || e.target === $btnSignUp) {
        $signIn.classList.toggle('active');
        $signUp.classList.toggle('active')
    }
});
    </script>
</body>
</html>
